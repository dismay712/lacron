services:
  lacron:
    image: lacron:local
    build:
      context: .
      pull: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:${LACRON_PORT:-8080}:8080"
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      LACRON_TOKEN: ${LACRON_TOKEN:-}
      LACRON_MAX_CONCURRENT: ${LACRON_MAX_CONCURRENT:-4}
    volumes:
      - lacron-data:/data
      - ./scripts:/scripts:ro
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m,mode=1777
      - /run:rw,noexec,nosuid,size=8m,mode=0755
    cap_drop:
      - ALL
    cap_add:
      - SETUID
      - SETGID
      - KILL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    stop_grace_period: 15s

volumes:
  lacron-data:
