services:
  lacron:
    image: lacron:local
    build:
      context: .
      pull: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:${LACRON_PORT:-8080}:8080"
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      LACRON_TOKEN: ${LACRON_TOKEN:-}
      LACRON_MAX_CONCURRENT: ${LACRON_MAX_CONCURRENT:-4}
      LACRON_APK_PACKAGES: ${LACRON_APK_PACKAGES:-}
    volumes:
      - lacron-data:/data
      - ./scripts:/scripts:ro
    # Writable root filesystem and default capabilities allow administrator apk installs.
    read_only: false
    pids_limit: 256
    stop_grace_period: 15s

volumes:
  lacron-data:
